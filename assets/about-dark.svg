<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300" viewBox="0 0 880 300"><style>
  .m { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
  .s { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
  
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style><rect x="0.5" y="0.5" width="879" height="299" rx="12" fill="#0d1117" stroke="#30363d"/><path d="M0.5 40 V12.5 a12 12 0 0 1 12 -12 H867.5 a12 12 0 0 1 12 12 V40 Z" fill="#161b22"/><line x1="0.5" y1="40" x2="879.5" y2="40" stroke="#30363d"/><text x="20" y="25" class="m" font-size="13"><tspan fill="#3fb950">$</tspan><tspan fill="#e6edf3"> cat about.md</tspan></text><text x="32" y="82" class="s" font-size="17" fill="#e6edf3">I'm a DevOps engineer. I get software from a merge request into production</text><text x="32" y="108" class="s" font-size="17" fill="#e6edf3">safely and repeatably, and keep it easy to see what's running.</text><rect x="32" y="140" width="196" height="132" rx="10" fill="#161b22" stroke="#30363d"/><text x="48" y="170" class="m" font-size="12" fill="#58a6ff">01</text><text x="74" y="170" class="s" font-size="16" font-weight="600" fill="#e6edf3">Ship</text><text x="48" y="200" class="s" font-size="13" fill="#7d8590">CI/CD and GitOps pipelines</text><text x="48" y="221" class="s" font-size="13" fill="#7d8590">that take code from merge</text><text x="48" y="242" class="s" font-size="13" fill="#7d8590">request to production.</text><rect x="242" y="140" width="196" height="132" rx="10" fill="#161b22" stroke="#30363d"/><text x="258" y="170" class="m" font-size="12" fill="#58a6ff">02</text><text x="284" y="170" class="s" font-size="16" font-weight="600" fill="#e6edf3">Run</text><text x="258" y="200" class="s" font-size="13" fill="#7d8590">Containerized services on</text><text x="258" y="221" class="s" font-size="13" fill="#7d8590">Kubernetes, with autoscaling</text><text x="258" y="242" class="s" font-size="13" fill="#7d8590">and health probes.</text><rect x="452" y="140" width="196" height="132" rx="10" fill="#161b22" stroke="#30363d"/><text x="468" y="170" class="m" font-size="12" fill="#58a6ff">03</text><text x="494" y="170" class="s" font-size="16" font-weight="600" fill="#e6edf3">Build</text><text x="468" y="200" class="s" font-size="13" fill="#7d8590">AWS infrastructure as</text><text x="468" y="221" class="s" font-size="13" fill="#7d8590">Terraform: reproducible,</text><text x="468" y="242" class="s" font-size="13" fill="#7d8590">reviewed and versioned.</text><rect x="662" y="140" width="196" height="132" rx="10" fill="#161b22" stroke="#30363d"/><text x="678" y="170" class="m" font-size="12" fill="#58a6ff">04</text><text x="704" y="170" class="s" font-size="16" font-weight="600" fill="#e6edf3">Secure</text><text x="678" y="200" class="s" font-size="13" fill="#7d8590">Least-privilege IAM and</text><text x="678" y="221" class="s" font-size="13" fill="#7d8590">no long-lived secrets</text><text x="678" y="242" class="s" font-size="13" fill="#7d8590">inside workloads.</text></svg>
