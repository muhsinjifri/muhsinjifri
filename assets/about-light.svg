  .m { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
  .s { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
  .t { animation: glow 10s ease-in-out infinite; }@keyframes glow { 0%, 26%, 100% { stroke: #d0d7de; } 6%, 18% { stroke: #0969da; } }.n { animation: num 10s ease-in-out infinite; }@keyframes num { 0%, 26%, 100% { opacity: 1; } 6%, 18% { opacity: .35; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style><rect x="0.5" y="0.5" width="879" height="299" rx="12" fill="#ffffff" stroke="#d0d7de"/><path d="M0.5 40 V12.5 a12 12 0 0 1 12 -12 H867.5 a12 12 0 0 1 12 12 V40 Z" fill="#f6f8fa"/><line x1="0.5" y1="40" x2="879.5" y2="40" stroke="#d0d7de"/><text x="20" y="25" class="m" font-size="13"><tspan fill="#1a7f37">$</tspan><tspan fill="#1f2328"> cat about.md</tspan></text><text x="32" y="82" class="s" font-size="17" fill="#1f2328">I'm a DevOps engineer. I get software from a merge request into production</text><text x="32" y="108" class="s" font-size="17" fill="#1f2328">safely and repeatably, and keep it easy to see what's running.</text><rect class="t" style="animation-delay:2.0s" x="32" y="140" width="196" height="132" rx="10" fill="#f6f8fa" stroke="#d0d7de"/><text x="48" y="170" class="m" font-size="12" fill="#0969da">01</text><text x="74" y="170" class="s" font-size="16" font-weight="600" fill="#1f2328">Ship</text><text x="48" y="200" class="s" font-size="13" fill="#656d76">CI/CD and GitOps pipelines</text><text x="48" y="221" class="s" font-size="13" fill="#656d76">that take code from merge</text><text x="48" y="242" class="s" font-size="13" fill="#656d76">request to production.</text><rect class="t" style="animation-delay:4.5s" x="242" y="140" width="196" height="132" rx="10" fill="#f6f8fa" stroke="#d0d7de"/><text x="258" y="170" class="m" font-size="12" fill="#0969da">02</text><text x="284" y="170" class="s" font-size="16" font-weight="600" fill="#1f2328">Run</text><text x="258" y="200" class="s" font-size="13" fill="#656d76">Containerized services on</text><text x="258" y="221" class="s" font-size="13" fill="#656d76">Kubernetes, with autoscaling</text><text x="258" y="242" class="s" font-size="13" fill="#656d76">and health probes.</text><rect class="t" style="animation-delay:7.0s" x="452" y="140" width="196" height="132" rx="10" fill="#f6f8fa" stroke="#d0d7de"/><text x="468" y="170" class="m" font-size="12" fill="#0969da">03</text><text x="494" y="170" class="s" font-size="16" font-weight="600" fill="#1f2328">Build</text><text x="468" y="200" class="s" font-size="13" fill="#656d76">AWS infrastructure as</text><text x="468" y="221" class="s" font-size="13" fill="#656d76">Terraform: reproducible,</text><text x="468" y="242" class="s" font-size="13" fill="#656d76">reviewed and versioned.</text><rect class="t" style="animation-delay:9.5s" x="662" y="140" width="196" height="132" rx="10" fill="#f6f8fa" stroke="#d0d7de"/><text x="678" y="170" class="m" font-size="12" fill="#0969da">04</text><text x="704" y="170" class="s" font-size="16" font-weight="600" fill="#1f2328">Secure</text><text x="678" y="200" class="s" font-size="13" fill="#656d76">Least-privilege IAM and</text><text x="678" y="221" class="s" font-size="13" fill="#656d76">no long-lived secrets</text><text x="678" y="242" class="s" font-size="13" fill="#656d76">inside workloads.</text></svg>
